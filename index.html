<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLyCi // night ride</title>
  <meta name="theme-color" content="#151314" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23151314'/%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='none' stroke='%23d4a35d' stroke-width='1.5'/%3E%3Ccircle cx='11' cy='16' r='2.5' fill='%23e8c782'/%3E%3Ccircle cx='21' cy='16' r='2.5' fill='%23e8c782'/%3E%3Cpath d='M13.5 21h5' stroke='%23a69a8d' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 2.5D Rainy City Canvas -->
    <canvas id="city-canvas" aria-label="Interactive 2.5D rainy night city map"></canvas>

    <!-- Soft Atmospheric Rain Vignette -->
    <div class="rain-vignette" aria-hidden="true"></div>

    <!-- Top HUD -->
    <header class="hud-top">
      <div class="hud-group hud-explored" title="Discovered city districts">
        <span class="hud-tag">ZONES</span>
        <div id="hud-zone-dots" class="zone-dots"></div>
        <span id="hud-zone-count" class="hud-count">0/4</span>
      </div>

      <div class="hud-center-wrap">
        <button id="hud-zone-pill" type="button" class="hud-pill" title="Open current district card">
          <span class="pill-dot"></span>
          <span id="hud-zone-name">PLAZA // 00</span>
        </button>
      </div>

      <div class="hud-right">
        <button id="btn-lights" type="button" class="hud-icon-btn on" title="Headlights: Low / High / Off (L)">
          <span id="lights-icon">💡</span>
          <span id="lights-label" class="hide-mobile">Low</span>
        </button>

        <button id="audio-toggle" type="button" class="hud-icon-btn" title="Toggle rain and ambient audio">
          <span id="audio-icon">🔇</span>
          <span class="hide-mobile">Rain</span>
        </button>

        <div class="hud-speed">
          <span id="hud-speed-val">0</span>
          <span class="hud-unit">KM/H</span>
        </div>
      </div>
    </header>

    <!-- District Info Overlay Panel -->
    <aside id="zone-panel" class="zone-panel hidden" aria-live="polite">
      <span class="bracket b-tl"></span>
      <span class="bracket b-tr"></span>
      <span class="bracket b-bl"></span>
      <span class="bracket b-br"></span>

      <div class="panel-header">
        <div class="panel-title-wrap">
          <span id="panel-badge" class="panel-badge">DISTRICT</span>
          <h2 id="panel-title" class="panel-title">SECTOR</h2>
        </div>
        <button id="panel-close" type="button" class="panel-close" aria-label="Close panel">✕</button>
      </div>

      <div id="panel-body" class="panel-body"></div>
    </aside>

    <!-- Bottom-Left Controls: Desktop Hint + Mobile Touch Joystick & Action Buttons -->
    <div class="hud-bottom-left">
      <div class="touch-controls">
        <div id="joystick-pad" class="joystick-pad" aria-label="Steering joystick">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
        <div class="action-stack">
          <button id="btn-boost" type="button" class="action-btn boost-btn" title="Boost and drift (Shift)">
            ⚡ BOOST
          </button>
          <button id="btn-horn" type="button" class="action-btn horn-btn" title="Horn + ping undiscovered districts (Space)">
            📯 HORN
          </button>
        </div>
      </div>
      <div class="key-hints">
        <span><kbd>WASD</kbd> drive</span>
        <span><kbd>Shift</kbd> boost</span>
        <span><kbd>Space</kbd> horn</span>
        <span><kbd>L</kbd> lights</span>
      </div>
    </div>

    <!-- Discrete Secret Track Bar -->
    <div id="secret-track-bar" class="secret-track-bar hidden">
      <button id="secret-track-toggle" type="button" class="secret-track-btn" title="Pause / Play">⏸</button>
      <span id="secret-track-title" class="secret-track-title">♪ Lil Peep — ghost girl</span>
      <input id="secret-track-vol" class="secret-track-vol" type="range" min="0" max="100" value="22" title="Track volume" />
      <a id="secret-track-link" class="secret-track-link" href="https://www.youtube.com/watch?v=1Woqr8nhWrY" target="_blank" rel="noopener noreferrer" title="Open on YouTube">↗</a>
    </div>
    <div id="yt-secret-host" class="yt-secret-host" aria-hidden="true"></div>

    <!-- Toast Notification Banner -->
    <div id="hud-toast" class="hud-toast hidden"></div>

    <!-- Ignition Intro Overlay -->
    <div id="intro-overlay" class="intro-overlay">
      <div class="intro-card">
        <span class="bracket b-tl"></span>
        <span class="bracket b-tr"></span>
        <span class="bracket b-bl"></span>
        <span class="bracket b-br"></span>

        <div id="intro-tag" class="intro-tag">FLYCI // RAINY NIGHT</div>
        <h1 id="intro-title" class="intro-title">FLyCi</h1>
        <p id="intro-subtitle" class="intro-subtitle"></p>

        <div class="intro-districts">
          <span class="chip c-about">↑ ABOUT</span>
          <span class="chip c-vibes">← VIBES</span>
          <span class="chip c-setup">→ SETUP</span>
          <span class="chip c-contact">↓ CONTACT</span>
          <span class="chip c-secret">🔒 SECRET (4/4)</span>
        </div>

        <div class="intro-actions">
          <button id="intro-start-btn" type="button" class="intro-start-btn">START ENGINE →</button>
          <label class="intro-audio-opt">
            <input id="intro-audio-check" type="checkbox" checked />
            <span>Enable rain audio and ambiance</span>
          </label>
        </div>

        <div class="intro-foot">
          Controls: <b>WASD / Arrows</b>, <b>Joystick</b> on mobile · <b>Space</b> (horn) pings nearby districts
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/city.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
